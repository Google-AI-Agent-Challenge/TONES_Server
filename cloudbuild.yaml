steps:
  # 1. Artifact Registry에 업로드할 Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/tones-repo/tones-server:latest',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/tones-repo/tones-server:$COMMIT_SHA',
      '.'
    ]

  # 2. 빌드된 도커 이미지를 Artifact Registry로 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/$PROJECT_ID/tones-repo/tones-server:latest'
    ]
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/$PROJECT_ID/tones-repo/tones-server:$COMMIT_SHA'
    ]

  # 3. Google Cloud Run에 도커 컨테이너 서비스 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'tones-server',
      '--image', 'us-central1-docker.pkg.dev/$PROJECT_ID/tones-repo/tones-server:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--min-instances', '0',
      '--max-instances', '5',
      '--cpu', '1',
      '--memory', '2Gi',
      '--add-cloudsql-instances', 'knudc-zintn11:us-central1:tones-db',
      '--set-env-vars', 'GEMINI_API_KEY=AIzaSyCz4y7BE36QmdD68Rxoep0GuWVJ80AfDuA',
    ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/tones-repo/tones-server:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/tones-repo/tones-server:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
