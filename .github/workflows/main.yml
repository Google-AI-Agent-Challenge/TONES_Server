name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🧪 Run Pytest & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          # Pydantic Settings 로드 유효성 검사용 더미 값 주입
          PROJECT_NAME: "TONES Server"
          API_V1_STR: "/api/v1"
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_service_role_key"
          PINECONE_API_KEY: "dummy-pinecone-api-key"
          PINECONE_ENVIRONMENT: "us-east-1"
          PINECONE_INDEX_NAME: "dummy-index"
          SECRET_KEY: "github-actions-ci-secret-key-123456789"
          GEMINI_API_KEY: "dummy-gemini-api-key"
        run: |
          python -m pytest

  docker-check:
    name: 🐳 Verify Docker Build Integrity
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false  # 배포 전 빌드 에러 유무만 검증
          tags: wooyeon-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to Railway
    needs: docker-check
    runs-on: ubuntu-latest
    # main 또는 master 브랜치에 직접 push 되거나 PR이 머지되었을 때만 실행
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # TODO: 만약 Railway 대시보드에 설정된 실제 백엔드 서비스명이 'wooyeon-server'가 아닌 경우,
        # 아래의 '--service wooyeon-server' 부분을 실제 서비스명으로 변경해 주세요.
        run: railway up --detach --service TONES_Server
